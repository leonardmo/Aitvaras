name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Privacy & commit hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Privacy sweep
        env:
          # The maintainer's private denylist (one regex per line). Hits are
          # reported by file and line only, so the terms never reach the log.
          AITVARAS_PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: scripts/check-privacy.sh
      - name: Commit metadata and history
        if: github.event_name == 'pull_request'
        env:
          AITVARAS_PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          RANGE: origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        run: |
          scripts/check-commits.sh "$RANGE"
          scripts/check-privacy.sh --commits "$RANGE"

  # Docs-only changes skip the macOS builds. The build jobs still run (on Ubuntu,
  # doing nothing), so their required checks report success instead of pending.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Unknown ranges (new branch, force push) count as code changes.
          if ! files="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              "" | docs/* | *.md | LICENSE | .github/ISSUE_TEMPLATE/* ) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  package:
    name: Package tests
    needs: changes
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Docs-only change
        if: env.CODE != 'true'
        run: echo "No code changed; package tests skipped."
      - uses: actions/checkout@v7
        if: env.CODE == 'true'
        with:
          fetch-depth: 0
      - name: Set file times to their last commit
        if: env.CODE == 'true'
        run: scripts/ci-restore-mtimes.py
      - uses: actions/setup-node@v7
        if: env.CODE == 'true'
        with:
          node-version: 24
      - name: Toolchain
        if: env.CODE == 'true'
        run: |
          xcodebuild -version
          swift --version
      # Cache from main or a manual run, refreshed with every commit there,
      # so PR builds only recompile what the PR changed.
      - uses: actions/cache/restore@v6
        if: env.CODE == 'true'
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ runner.os }}-
      - name: Node helper contracts
        if: env.CODE == 'true'
        run: make node-test
      - name: Build tests
        if: env.CODE == 'true'
        run: swift build --build-tests
      # PR runs only read the cache; saving per PR would evict main's entries.
      - uses: actions/cache/save@v6
        if: env.CODE == 'true' && github.event_name != 'pull_request'
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
      # Hosted runners have 3 cores; the subprocess-heavy suites starve each
      # other when run in parallel, so CI runs them serially.
      - name: swift test
        if: env.CODE == 'true'
        timeout-minutes: 60
        run: swift test --skip-build --no-parallel

  app:
    name: App build
    needs: changes
    # Xcode 26.6's Swift 6.3 compiler crashes in IRGen on the app target;
    # build with the same Xcode 27 the app is developed with.
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CODE: ${{ needs.changes.outputs.code }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Docs-only change
        if: env.CODE != 'true'
        run: echo "No code changed; app build skipped."
      - uses: actions/checkout@v7
        if: env.CODE == 'true'
        with:
          fetch-depth: 0
      - name: Set file times to their last commit
        if: env.CODE == 'true'
        run: scripts/ci-restore-mtimes.py
      - name: Tools
        if: env.CODE == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain || true
      # The whole derived data, so unchanged app sources are not recompiled.
      - uses: actions/cache/restore@v6
        if: env.CODE == 'true'
        with:
          path: .build-xcode
          key: xcode-dd-${{ runner.os }}-${{ hashFiles('Package.resolved', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            xcode-dd-${{ runner.os }}-${{ hashFiles('Package.resolved', 'project.yml') }}-
            xcode-dd-${{ runner.os }}-
      - name: Build (Debug)
        if: env.CODE == 'true'
        run: make app
      - uses: actions/cache/save@v6
        if: env.CODE == 'true' && github.event_name != 'pull_request'
        with:
          path: .build-xcode
          key: xcode-dd-${{ runner.os }}-${{ hashFiles('Package.resolved', 'project.yml') }}-${{ github.sha }}
      - name: Upload build log
        if: failure() && env.CODE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: .build-xcode/build.log
