name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Privacy & commit hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Privacy sweep
        run: scripts/check-privacy.sh
      - name: Commit metadata
        if: github.event_name == 'pull_request'
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  package:
    name: Package tests
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Node helper contracts
        run: make node-test
      - name: Build tests
        run: swift build --build-tests
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
      # Hosted runners have 3 cores; the subprocess-heavy suites starve each
      # other when run in parallel, so CI runs them serially.
      - name: swift test
        timeout-minutes: 60
        run: swift test --skip-build --no-parallel

  app:
    name: App build
    # Xcode 26.6's Swift 6.3 compiler crashes in IRGen on the app target;
    # build with the same Xcode 27 the app is developed with.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain || true
      - uses: actions/cache/restore@v6
        with:
          path: .build-xcode/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'project.yml') }}
          restore-keys: xcode-spm-${{ runner.os }}-
      - name: Build (Debug)
        run: make app
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .build-xcode/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'project.yml') }}
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: .build-xcode/build.log
