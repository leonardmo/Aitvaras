name: Aitvaras
options:
  bundleIdPrefix: app.aitvaras
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
packages:
  AitvarasKit:
    path: .
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.9
targets:
  NotifyReader:
    type: tool
    platform: macOS
    sources:
      - helper/NotifyReader
    settings:
      base:
        PRODUCT_NAME: notify-reader
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"

  Aitvaras:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
      - path: voice/tts_server.py
        buildPhase: resources
      - path: voice/kokoro_patches.py
        buildPhase: resources
      - path: scripts/setup-neural-voice.sh
        buildPhase: resources
    dependencies:
      - target: NotifyReader
        embed: false
      - package: AitvarasKit
        products:
          - AitvarasCore
          - AitvarasStore
          - AitvarasEngines
          - AitvarasRAG
          - AitvarasConnectors
          - AitvarasVoice
          - AitvarasAgent
          - AitvarasAgents
      - package: GLTFKit2
    settings:
      base:
        # `make e2e` overrides this: XCUITest terminates running apps with the
        # same bundle id, and the installed app may be recording.
        AITVARAS_BUNDLE_ID: app.aitvaras.Aitvaras
        PRODUCT_BUNDLE_IDENTIFIER: $(AITVARAS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Aitvaras
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    postCompileScripts:
      - script: |
          cp "$BUILT_PRODUCTS_DIR/notify-reader" "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/notify-reader"
        name: Embed notify-reader helper
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(EXECUTABLE_FOLDER_PATH)/notify-reader
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aitvaras
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Local-first personal AI. Cloud use is explicit.
        NSMicrophoneUsageDescription: Aitvaras uses the microphone for voice conversations and captures you start. Audio stays on this Mac and is saved only if you explicitly enable source retention for capture.
        NSSpeechRecognitionUsageDescription: Aitvaras transcribes speech on-device for voice conversations and captures you start.
        NSCalendarsFullAccessUsageDescription: Aitvaras reads your calendar and creates events for you (she only ever modifies events she created herself).
        NSRemindersFullAccessUsageDescription: Aitvaras reads and creates reminders/todos for you.
        NSAppleEventsUsageDescription: Aitvaras reads new mail from Apple Mail, holds unknown senders for review, and can summarize approved senders or suggest confirmation-gated actions. Mail stays unread and no mail is ever sent automatically.
        NSAudioCaptureUsageDescription: During a capture session Aitvaras transcribes system audio on-device. Audio is discarded unless you explicitly choose to retain source audio locally.

  AitvarasUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Aitvaras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aitvaras.AitvarasUITests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aitvaras

schemes:
  Aitvaras:
    build:
      targets:
        Aitvaras: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AitvarasUITests
